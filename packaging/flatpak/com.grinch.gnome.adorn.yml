app-id: com.grinch.gnome.adorn
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: adorn

finish-args:
  # Display & GPU
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Network access for extensions and themes APIs
  - --share=network
  # GNOME Shell extension DBus interface & session
  - --talk-name=org.gnome.Shell
  - --talk-name=org.gnome.Shell.Extensions
  - --talk-name=org.gnome.SessionManager
  # GSettings / dconf
  - --talk-name=ca.desrt.dconf
  - --filesystem=xdg-run/dconf
  # Customization directories
  - --filesystem=~/.local/share/gnome-shell/extensions:create
  - --filesystem=~/.themes:create
  - --filesystem=~/.icons:create
  - --filesystem=xdg-data/themes:create
  - --filesystem=xdg-data/icons:create
  - --filesystem=xdg-config/gtk-4.0:create
  - --filesystem=xdg-config/autostart:create
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-download

modules:
  - name: adorn
    buildsystem: simple
    build-commands:
      - pip3 install --no-deps --no-build-isolation --prefix=/app .
    sources:
      - type: dir
        path: ../..
