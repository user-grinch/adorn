<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <linearGradient id="bgTile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9141ac"/>
      <stop offset="100%" stop-color="#613583"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e01b24"/>
      <stop offset="100%" stop-color="#ff7800"/>
    </linearGradient>
  </defs>

  <!-- Base Dark HIG Tile -->
  <rect x="14" y="14" width="100" height="100" rx="24" fill="url(#bgTile)" filter="url(#shadow)"/>
  <rect x="14.5" y="14.5" width="99" height="99" rx="23.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.14"/>

  <!-- Layer 1: Wallpaper card (Bottom) -->
  <rect x="26" y="48" width="56" height="42" rx="8" fill="url(#cardGrad3)" opacity="0.85" transform="rotate(-8 54 69)"/>

  <!-- Layer 2: Icon Pack card (Middle) -->
  <rect x="36" y="40" width="56" height="42" rx="8" fill="url(#cardGrad2)" opacity="0.9" transform="rotate(4 64 61)"/>
  
  <!-- Layer 3: Main Desktop / Theme card (Top) -->
  <rect x="42" y="32" width="56" height="42" rx="8" fill="url(#cardGrad1)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Mini titlebar on top card -->
  <rect x="42" y="32" width="56" height="10" rx="8" fill="#1c71d8"/>
  <circle cx="48" cy="37" r="2" fill="#ed333b"/>
  <circle cx="54" cy="37" r="2" fill="#f6d32d"/>
  <circle cx="60" cy="37" r="2" fill="#33d17a"/>
  
  <!-- Adorn Sparkle star -->
  <path d="M 28 26 Q 28 32, 34 32 Q 28 32, 28 38 Q 28 32, 22 32 Q 28 32, 28 26 Z" fill="#f6d32d"/>
  <path d="M 102 78 Q 102 83, 107 83 Q 102 83, 102 88 Q 102 83, 97 83 Q 102 83, 102 78 Z" fill="#33d17a"/>
</svg>
